name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check

  # Law L4: compile and replay inside a network namespace that only has the loopback.
  # The kit checks that nothing outside can be reached, then runs every law.
  no-network:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Conformance with the network closed
        run: |
          sudo env "PATH=$PATH" "RUN_AS=$(id -u)" "RUN_HOME=$HOME" unshare -n bash -c \
            'set -eo pipefail; ip link set lo up; sudo -u "#$RUN_AS" env "PATH=$PATH" "HOME=$RUN_HOME" pnpm conformance --network-closed | tee /tmp/report.txt; grep -q "^L4  No model      pass" /tmp/report.txt'

  # The compiled Maestro flows are checked by Maestro itself. Syntax only: the device run is in device.yml.
  maestro-syntax:
    runs-on: ubuntu-latest
    env:
      MAESTRO_VERSION: 2.12.1
      MAESTRO_CLI_NO_ANALYTICS: 1
    steps:
      - uses: actions/checkout@v4
      - name: Install Maestro
        run: |
          curl -fsSL "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
      - name: Check the syntax of the compiled flows
        run: |
          for flow in packages/adapter-maestro/examples/*.flow.yaml packages/adapter-maestro/device/*.flow.yaml; do
            echo "== $flow"
            maestro check-syntax "$flow"
          done
