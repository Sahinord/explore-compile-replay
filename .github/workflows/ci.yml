name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check

  # The compiled Maestro flows are checked by Maestro itself. Syntax only: the device run is in device.yml.
  maestro-syntax:
    runs-on: ubuntu-latest
    env:
      MAESTRO_VERSION: 2.12.1
      MAESTRO_CLI_NO_ANALYTICS: 1
    steps:
      - uses: actions/checkout@v4
      - name: Install Maestro
        run: |
          curl -fsSL "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
      - name: Check the syntax of the compiled flows
        run: |
          for flow in packages/adapter-maestro/examples/*.flow.yaml packages/adapter-maestro/device/*.flow.yaml; do
            echo "== $flow"
            maestro check-syntax "$flow"
          done
