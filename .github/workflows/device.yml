# Replays compiled flows on a real Android emulator, against Tiny Todo, the
# demo app of mobile-agent-testers. No model, no secret: only free runner time.
# Started by hand for now, because a run takes about fifteen minutes.
name: device

on:
  workflow_dispatch:
    inputs:
      app_ref:
        description: Commit of pierridotite/mobile-agent-testers whose demo app is built
        default: a4135e2875399a654ed23ff610c30134aba087a2

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      MAESTRO_VERSION: 2.12.1
      MAESTRO_CLI_NO_ANALYTICS: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: pierridotite/mobile-agent-testers
          ref: ${{ inputs.app_ref }}
          path: app-repo
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: gradle/actions/setup-gradle@v4
      - run: pnpm install --frozen-lockfile
      - name: Build the demo app
        working-directory: app-repo
        run: |
          GITHUB_WORKSPACE="$PWD" bash scripts/build/android.sh demo-app expo || { tail -n 40 results/build-android.log; exit 1; }
      - name: Install Maestro
        run: |
          curl -fsSL "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: Emulator, then replay
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          profile: pixel_6
          ram-size: 4096M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: bash packages/adapter-maestro/device/replay.sh app-repo/app.apk
