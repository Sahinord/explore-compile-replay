<svg xmlns="http://www.w3.org/2000/svg" width="900" height="212" viewBox="0 0 900 212" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="Explore, once with an agent. The trace is compiled to a test file that runs without ECR and is replayed in CI with no model. When the app changes, a bounded repair proposes a patch, which is compiled again.">
  <defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8B949E"/></marker></defs>
  <rect x="15" y="20" width="150" height="64" rx="10" fill="#F0F6FC" stroke="#F0F6FC"/>
  <text x="90" y="48" text-anchor="middle" font-size="16" font-weight="600" fill="#0D1117">Explore</text>
  <text x="90" y="67" text-anchor="middle" font-size="12" fill="#0D1117" opacity="0.92">an agent, once</text>
  <rect x="195" y="20" width="150" height="64" rx="10" fill="#161B22" stroke="#30363D"/>
  <text x="270" y="48" text-anchor="middle" font-size="16" font-weight="600" fill="#F0F6FC">Trace</text>
  <text x="270" y="67" text-anchor="middle" font-size="12" fill="#8B949E" opacity="0.92">typed, validated</text>
  <rect x="375" y="20" width="150" height="64" rx="10" fill="#F0F6FC" stroke="#F0F6FC"/>
  <text x="450" y="48" text-anchor="middle" font-size="16" font-weight="600" fill="#0D1117">Compile</text>
  <text x="450" y="67" text-anchor="middle" font-size="12" fill="#0D1117" opacity="0.92">to a standard test</text>
  <rect x="555" y="20" width="150" height="64" rx="10" fill="#161B22" stroke="#30363D"/>
  <text x="630" y="48" text-anchor="middle" font-size="16" font-weight="600" fill="#F0F6FC">Test file</text>
  <text x="630" y="67" text-anchor="middle" font-size="12" fill="#8B949E" opacity="0.92">runs without ECR</text>
  <rect x="735" y="20" width="150" height="64" rx="10" fill="#3FB950" stroke="#3FB950"/>
  <text x="810" y="48" text-anchor="middle" font-size="16" font-weight="600" fill="#0D1117">Replay in CI</text>
  <text x="810" y="67" text-anchor="middle" font-size="12" fill="#0D1117" opacity="0.92">no model, no tokens</text>
  <path d="M165 52H193" stroke="#8B949E" stroke-width="1.6" fill="none" marker-end="url(#a)"/>
  <path d="M345 52H373" stroke="#8B949E" stroke-width="1.6" fill="none" marker-end="url(#a)"/>
  <path d="M525 52H553" stroke="#8B949E" stroke-width="1.6" fill="none" marker-end="url(#a)"/>
  <path d="M705 52H733" stroke="#8B949E" stroke-width="1.6" fill="none" marker-end="url(#a)"/>
  <rect x="555" y="128" width="150" height="64" rx="10" fill="#161B22" stroke="#30363D"/>
  <text x="630" y="156" text-anchor="middle" font-size="16" font-weight="600" fill="#F0F6FC">Repair</text>
  <text x="630" y="175" text-anchor="middle" font-size="12" fill="#8B949E" opacity="0.92">bounded, never a check</text>
  <path d="M810 84V160H707" stroke="#8B949E" stroke-width="1.6" fill="none" stroke-dasharray="5 4" marker-end="url(#a)"/>
  <path d="M555 160H450V86" stroke="#8B949E" stroke-width="1.6" fill="none" stroke-dasharray="5 4" marker-end="url(#a)"/>
  <text x="822" y="124" font-size="12" fill="#8B949E">the app</text>
  <text x="822" y="140" font-size="12" fill="#8B949E">changed</text>
  <text x="438" y="124" text-anchor="end" font-size="12" fill="#8B949E">accepted</text>
  <text x="438" y="140" text-anchor="end" font-size="12" fill="#8B949E">patch</text>
</svg>
